name: Actualizar datos de partidos

on:
  schedule:
    # Todos los días a las 06:00 UTC (ajusta a tu gusto)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions
  push:
    paths:
      - "config.json"
      - "scraper/**"
      - ".github/workflows/scrape.yml"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scraper/requirements.txt

      - name: Ejecutar scraper
        run: python scraper/futgal_scraper.py --config config.json --output docs/data/partidos.json --delay 1.5

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/partidos.json
          git diff --staged --quiet || git commit -m "Actualiza datos de partidos [skip ci]"
          git push
