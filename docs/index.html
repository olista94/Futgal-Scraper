<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partidos - Árbitros y asistentes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="titulo">Partidos</h1>
    <p id="actualizado" class="muted"></p>
  </header>

  <main>
    <div class="controls">
      <label for="jornada">Jornada:</label>
      <select id="jornada"></select>
    </div>

    <div id="estado" class="muted"></div>

    <table id="tabla">
      <thead>
        <tr>
          <th>Local</th>
          <th>Visitante</th>
          <th>Árbitro</th>
          <th>Asistente 1</th>
          <th>Asistente 2</th>
        </tr>
      </thead>
      <tbody id="tabla-body"></tbody>
    </table>
  </main>

  <footer>
    <p class="muted">Datos obtenidos automáticamente de futgal.es</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
